name: Store readiness tests
on:
  push:
    branches: [store-readiness, android-qa]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: store-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  logic-and-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build && npm test && npm run check && node scripts/store-preflight.mjs
      - run: npm audit --omit=dev --audit-level=high
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 31
            shape: phone
            size: 1080x1920
            density: 420
          - api: 36
            shape: phone
            size: 1080x2400
            density: 420
          - api: 36
            shape: fold
            # Same 690x829 dp layout; fewer software-rendered pixels in CI.
            size: 906x1088
            density: 210
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties
      - run: npm ci && npm run build && npx cap sync android
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build release bundle, lint and test APK
        working-directory: android
        run: ./gradlew :app:bundleRelease :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Audit actual release bundle and merged manifest
        run: python3 scripts/ci/audit-android-release.py
      - name: Run real Android WebView integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu software -feature GuestAngle -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: |
            adb shell wm size ${{ matrix.size }}
            adb shell wm density ${{ matrix.density }}
            adb shell dumpsys webviewupdate > android-webview.txt
            bash scripts/ci/run-android-tests.sh
      - name: Capture diagnostics
        if: always()
        run: |
          mkdir -p build/qa
          cp android-webview.txt build/qa/ 2>/dev/null || true
          free -m
          sudo dmesg | tail -n 80 > build/qa/host-kernel-tail.txt
          tail -n 60 build/qa/android-logcat.txt || true
          cat build/qa/host-kernel-tail.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-QA-${{ matrix.api }}-${{ matrix.shape }}
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            android/app/build/outputs/bundle/release/
            android/app/build/outputs/apk/debug/
            build/qa/
          retention-days: 30
  ios:
    if: github.ref_name != 'android-qa'
    runs-on: macos-26
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        family: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build && npx cap sync ios
      - name: Select installed simulator
        env:
          DEVICE_FAMILY: ${{ matrix.family }}
        run: |
          mkdir -p build/qa
          xcrun simctl list devices available -j > build/qa/simulators.json
          python3 scripts/ci/select-simulator.py
      - name: Execute app integration tests in simulator
        run: |
          set -o pipefail
          xcodebuild test -project ios/App/App.xcodeproj -scheme FrameTests -configuration Debug -destination "platform=iOS Simulator,id=$FRAME_SIMULATOR" -parallel-testing-enabled NO -derivedDataPath build/ios-test -resultBundlePath build/qa/FRAME-${{ matrix.family }}.xcresult CODE_SIGNING_ALLOWED=NO | tee build/qa/xcode-tests.log
      - name: Package tested simulator app
        if: matrix.family == 'iPhone'
        run: ditto -c -k --sequesterRsrc --keepParent build/ios-test/Build/Products/Debug-iphonesimulator/App.app build/FRAME-iOS-Simulator.app.zip
      - uses: actions/upload-artifact@v4
        if: success() && matrix.family == 'iPhone'
        with:
          name: FRAME-iOS-Simulator
          path: build/FRAME-iOS-Simulator.app.zip
          retention-days: 30
      - name: Build unsigned device archive
        if: matrix.family == 'iPhone'
        run: xcodebuild archive -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath build/FRAME-unsigned.xcarchive CODE_SIGNING_ALLOWED=NO
      - name: Audit actual device archive
        if: matrix.family == 'iPhone'
        run: python3 scripts/ci/audit-ios-archive.py
      - name: Export native screenshots from XCTest results
        if: always()
        run: |
          mkdir -p build/qa/native-screenshots
          xcrun xcresulttool export attachments --path build/qa/FRAME-${{ matrix.family }}.xcresult --output-path build/qa/native-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-QA-${{ matrix.family }}
          path: build/qa/
          retention-days: 30
      - name: Package unsigned device archive
        if: success() && matrix.family == 'iPhone'
        run: ditto -c -k --sequesterRsrc --keepParent build/FRAME-unsigned.xcarchive build/FRAME-unsigned.xcarchive.zip
      - uses: actions/upload-artifact@v4
        if: success() && matrix.family == 'iPhone'
        with:
          name: FRAME-unsigned-device-archive
          path: build/FRAME-unsigned.xcarchive.zip
          retention-days: 30
