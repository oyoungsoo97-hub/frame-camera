name: Preserve native QA evidence
on:
  push:
    branches: [qa-evidence]
permissions:
  contents: write
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QA_RUN: '44545407442'
      ANDROID_QA_RUN: '44545407442'
      IPAD_QA_RUN: '44547058001'
      EVIDENCE_TAG: 'qa-evidence-44545407442'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for targeted iPad verification
        run: timeout 15m gh run watch "$IPAD_QA_RUN" --exit-status --interval 30
      - name: Retrieve completed run evidence
        run: |
          for SPEC in "$QA_RUN:qa" "$ANDROID_QA_RUN:android-qa" "$IPAD_QA_RUN:ipad-qa"; do
            RUN_ID=${SPEC%%:*}
            PREFIX=${SPEC#*:}
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$PREFIX-run.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" > "$PREFIX-jobs.json"
            QA_TESTED_SHA=$(python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["status"]=="completed", "QA run must finish"; print(r["head_sha"])' "$PREFIX-run.json")
            git diff --exit-code "$QA_TESTED_SHA" HEAD -- dist ios android package.json package-lock.json capacitor.config.json ':(exclude)ios/App/FRAMEIntegrationTests/**' ':(exclude)android/app/src/androidTest/**'
          done
          python3 scripts/ci/verify-evidence-jobs.py
          gh run download "$QA_RUN" --pattern 'iOS-QA-iPhone' --pattern 'FRAME-unsigned-device-archive' --pattern 'FRAME-iOS-Simulator' --dir evidence
          gh run download "$ANDROID_QA_RUN" --pattern 'Android-QA-*' --dir evidence
          gh run download "$IPAD_QA_RUN" --pattern 'iOS-QA-iPad' --dir evidence
          gh run download "$QA_RUN" --pattern 'iOS-QA-iPad' --dir superseded-downloads
          mkdir -p evidence/superseded-ipad
          cp superseded-downloads/iOS-QA-iPad/xcode-tests.log evidence/superseded-ipad/xcode-tests.log
      - name: Package reports, native screenshots and unsigned build samples
        run: |
          mkdir -p release-evidence
          python3 scripts/ci/package-evidence.py
          cp evidence/FRAME-unsigned-device-archive/FRAME-unsigned.xcarchive.zip release-evidence/FRAME-2.1.0-unsigned.xcarchive.zip
          cp evidence/Android-QA-36-phone/android/app/build/outputs/bundle/release/app-release.aab release-evidence/FRAME-2.1.0-unsigned.aab
          cp evidence/Android-QA-36-phone/android/app/build/outputs/apk/debug/app-debug.apk release-evidence/FRAME-2.1.0-Android-debug.apk
          cp evidence/FRAME-iOS-Simulator/FRAME-iOS-Simulator.app.zip release-evidence/FRAME-2.1.0-iOS-Simulator.app.zip
          git archive --format=zip --prefix=FRAME/ HEAD -o release-evidence/FRAME-2.1.0-Web-iOS-Android-source.zip
          (cd dist && zip -qr ../release-evidence/FRAME-2.1.0-HTML.zip .)
          (cd store && zip -qr ../release-evidence/FRAME-2.1.0-Store-documents.zip .)
          cd release-evidence
          sha256sum * > SHA256SUMS.txt
      - name: Preserve evidence as a clearly marked prerelease
        run: |
          cat > notes.txt <<'NOTES'
          FRAME 2.1.0 is prepared for further Apple/Google store testing in German, English and Korean. Publisher decision: Youngsoo Oh, individual; €2.99 once; worldwide where store sales are allowed; no ads, subscription or in-app purchases.

          Verified: 69 logic tests, 12 iOS simulator tests and 24 Android emulator tests. iPhone, Android and build samples: run 44545407442, commit 33bd45f. iPad: targeted run 44547058001, commit 2d0bf84, after correcting a test timer boundary. Production app files are identical; only test code and documentation differ. The original iPad timeout log is preserved, and its failed job is not counted as passed. Read all job metadata files and [the test report](https://github.com/oyoungsoo97-hub/frame-camera/blob/main/store/reports/TEST-REPORT.md).

          The full-pixel fold emulator stalled. Its replacement preserves logical viewport size at 906×1088 pixels / 210 dpi; physical Fold5 graphics, hinge and camera behavior remain untested. The earlier full-pixel run was cancelled. The selected Android jobs pass with the documented scaled configuration. Both the superseded full-pixel stall and the initial iPad test timeout remain documented.

          Downloads include HTML, complete source, store documents, 30 actual native demo screenshots in the QA evidence ZIP, debug APK, iOS simulator app and unsigned native build samples. SHA256SUMS.txt verifies the files.

          **Not a store release:** physical-device acceptance, developer accounts, public support email, production signing and store review remain pending. The AAB and iOS device archive are unsigned. The debug APK is for Android testing only; the simulator app cannot be installed on an iPhone. Screenshots use the generated demo image, never user camera photos.
          NOTES
          gh release create "$EVIDENCE_TAG" release-evidence/* --target "$GITHUB_SHA" --prerelease --latest=false --title "FRAME 2.1.0 · Store preparation and test evidence" --notes-file notes.txt
          cat > superseded.txt <<'NOTES'
          Superseded by the visually corrected QA package: https://github.com/oyoungsoo97-hub/frame-camera/releases/tag/qa-evidence-44545407442

          Later screenshot inspection found an empty full-screen photo frame on Android 12 / WebView 91 that the original functional assertions missed. The new package fixes the viewport fallback and requires nonzero photo/image geometry in native layout and screenshot checks. Do not use this earlier package for store submission. Physical-device acceptance and signing remain pending.
          NOTES
          gh release edit "qa-evidence-44538808448" --notes-file superseded.txt
          gh release edit "qa-evidence-44538808448-r2" --notes-file superseded.txt
