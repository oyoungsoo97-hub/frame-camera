name: Build native apps
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FRAME-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
  ios-simulator:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build simulator app
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/Build/Products/Debug-iphonesimulator/App.app build/FRAME-iOS-Simulator.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FRAME-iOS-Simulator
          path: build/FRAME-iOS-Simulator.app.zip
          if-no-files-found: error
          retention-days: 30
